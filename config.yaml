# Общая конфигурация проекта
tesseract:
  path: null

ocr:
  # DPI (точек на дюйм) для рендеринга страниц PDF в изображения.
  # Более высокое значение улучшает качество OCR, но замедляет процесс.
  dpi: 400
  languages: "rus+chu"
  engine: "tesseract"
  tesseract_oem: 1
  psm_candidates: [4, 6, 11]
  preprocess_variants: ["adaptive_gaussian", "adaptive_mean", "otsu"]
  # Приводить дореформенные символы (ѣ, і, ѳ...) к современным.
  normalize_old_letters: true
  # Сохранять промежуточные изображения в debug_ocr/.
  save_debug_images: true
  # Параметры предобработки изображения.
  upscale_factor: 1.8
  denoise_h: 10
  clahe_clip_limit: 2.0
  clahe_grid_size: 8
  adaptive_block_size: 21
  adaptive_c: 4

output:
  suffix: "_распознано.txt"

llm_cleaning:
  enabled: true
  provider: "openai"
  model: "meta-llama/llama-3.1-8b-instruct"
  api_base: "https://openrouter.ai/api/v1"
  api_key_env: "OPEN_ROUTER_KEY"
  temperature: 0.0
  max_chunk_chars: 1800
  overlap_chars: 0
  timeout_sec: 60
  only_if_suspect: true
  suspect_score_threshold: 0.12
  min_text_length_for_llm: 600
  max_requests_per_run: 15
  enable_chunk_cache: true
  strict_mode: true
  max_change_ratio: 0.35
  min_cyrillic_ratio: 0.30
  # Заменять колонку data.text_column очищенным текстом.
  replace_text_column: true
  # Контекст для модели (жанр, период, особенности документов).
  context_notes: "Дореволюционные русские печатные документы и объявления начала XX века."
  cleanup_rules:
    - "исправляй OCR-ошибки символов, не меняя смысл"
    - "сохраняй имена, фамилии, даты, названия населенных пунктов и должностей"
    - "не добавляй информацию, которой нет в исходном фрагменте"
    - "сохраняй структуру абзацев и списков, где возможно"


data:
  
  file_path: "data.csv"
  text_column: "text"
  category_column: "category"

preprocessing:
  stop_words_path: "stop_ru.txt"
  punctuation: "!\\\"#$ %&'()*+,-./:;<=>?@[\\]^_`{|}~—»«...–"

model:
  # Количество тем (topics), которое будет искать модель LDA.
  num_topics: 20
  # Количество проходов по всему корпусу текстов во время обучения.
  passes: 10
  # Фиксированное значение для генератора случайных чисел для воспроизводимости.
  random_state: 42

evaluation:
  coherence_measure: "c_v"
  # Параметры для поиска оптимального количества тем.
  max_topics: 30      # Максимальное количество тем для проверки.
  start_topics: 2     # С какого количества тем начинать.
  step_topics: 3      # Шаг увеличения количества тем.

visualization:
   output_html_path: "lda_visualization.html"
