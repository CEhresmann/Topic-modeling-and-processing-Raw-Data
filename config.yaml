# Общая конфигурация проекта

# --- Конфигурация для OCR (распознавание текста) ---
tesseract:
  # Путь к исполняемому файлу tesseract (особенно актуально для Windows)
  # Пример для Windows: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
  # Для Linux/macOS, если tesseract в PATH, можно оставить null.
  path: null

ocr:
  # DPI (точек на дюйм) для рендеринга страниц PDF в изображения.
  # Более высокое значение улучшает качество OCR, но замедляет процесс.
  dpi: 400
  # Языки для распознавания. Например, "rus+chu" для русского и церковнославянского.
  languages: "rus+chu"
  # Движок OCR: 'tesseract' или 'easyocr'.
  engine: "tesseract"

output:
  suffix: "_распознано.txt"


data:
  
  file_path: "data.csv"
  # Название колонки с текстами.
  text_column: "text"
  # (Опционально) Название колонки с категориями для финального анализа.
  category_column: "category"

preprocessing:
  # Путь к файлу со стоп-словами (одно слово на строку).
  stop_words_path: "stop_ru.txt"
  # Строка со знаками пунктуации, которые будут удалены из текста.
  punctuation: "!\\\"#$ %&'()*+,-./:;<=>?@[\\]^_`{|}~—»«...–"

model:
  # Количество тем (topics), которое будет искать модель LDA.
  num_topics: 20
  # Количество проходов по всему корпусу текстов во время обучения.
  passes: 10
  # Фиксированное значение для генератора случайных чисел для воспроизводимости.
  random_state: 42

evaluation:
  # Метрика для оценки когерентности модели (насколько темы "читаемы").
  coherence_measure: "c_v"
  # Параметры для поиска оптимального количества тем.
  max_topics: 30      # Максимальное количество тем для проверки.
  start_topics: 2     # С какого количества тем начинать.
  step_topics: 3      # Шаг увеличения количества тем.

visualization:
  # Путь для сохранения интерактивной HTML-визуализации тем (pyLDAvis).
  output_html_path: "lda_visualization.html"
