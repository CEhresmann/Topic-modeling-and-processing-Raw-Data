[project]
name = "jupyterproject"
version = "0.1.0"
description = "Просто ноутбук для тематического моделирования не обработанных заранее данных. С предобработкой типа."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pypdf2",
    "pdfminer-six",
    "pdfplumber",
    "pillow",
    "pdf2image",
    "pytesseract",
    "opencv-python",
    "numpy",
    "pandas",
    "nltk",
    "matplotlib",
    "seaborn",
    "pyLDAvis",
    "pymorphy2",
    "pyyaml",
    "easyocr",
    "gensim>=4.4.0",
    "PyMuPDF",
    "scipy",
    "scikit-image",
    "tqdm",
    "click",
]

[project.scripts]
text-processor = "jupyterproject.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
lint.ignore = [
    "E501",  # line too long (handled by black)
    "F401",  # unused import (we'll fix separately)
    "F841",  # unused variable
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "build",
    "dist",
    "*.pyc",
    "*.pyo",
    "*.pyd",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "Тематическое_моделирование.ipynb",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ['py312']
extend-exclude = '''
/(
    \.git
    | __pycache__
    | \.venv
    | build
    | dist
    | \.mypy_cache
    | \.ruff_cache
    | \.pytest_cache
    | Тематическое_моделирование\.ipynb  # ← добавить эту строку
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
exclude = [
    "Тематическое_моделирование.ipynb",
]
